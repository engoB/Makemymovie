# Publie le Studio (studio/) et les films terminés (mes-films/ → films/) sur GitHub Pages à chaque push sur main.
# Une seule fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: studio

on:
  push:
    branches: [main]
    paths: ['studio/**', 'mes-films/**', '.github/workflows/studio.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assembler le site
        run: |
          mkdir -p _site
          cp -R studio/. _site/
          rm -rf _site/outils
          mkdir -p _site/films
          cp -R mes-films/. _site/films/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
